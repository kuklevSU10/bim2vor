# Реестр экспертов-специалистов.
# Каждый эксперт = одна предметная область = один LLM-вызов на проект.
# Принцип: эксперт получает только то что относится к его домену + связанные позиции ВОР.

specialists:
  # ====================================================================
  # МОНОЛИТ — главный, самый большой раздел
  # ====================================================================
  monolith:
    name: "Эксперт по монолитным конструкциям"
    short_name: "монолитчик"
    boq_sections: [5, 6]
    boq_section_names:
      - "Несущие конструкции подземной части"
      - "Несущие конструкции надземной части"
    domain_description: |
      Монолитные конструкции из тяжёлого/лёгкого бетона с арматурой:
      - Стены подвала, надземные стены (несущие, выполненные литьём бетона)
      - Колонны несущие
      - Перекрытия (плиты), монолитные плиты фундамента
      - Лестничные марши и площадки (если монолитные)
      - Балки, ригели, ростверки
      Сопутствующие работы: опалубка, арматура, гидроизоляция бетона.
    candidate_revit_categories:
      - OST_Walls               # фильтр: несущая, бетонная (по family с УН-Бетон / СН-Бетон)
      - OST_Floors              # фильтр: толстая монолитная плита (>150мм без отделочных слоёв)
      - OST_StructuralColumns
      - OST_StructuralFraming   # балки
      - OST_StructuralFoundation
      - OST_Stairs              # фильтр: монолитная лестница
    family_signal_words:
      include: [Бетон, бетон, монолит, фундамент, плита, ростверк, ригель]
      exclude: [Блок, кирпич, штукатурка, отделка, утеплит, изоляц, плитка]

  # ====================================================================
  # КЛАДКА — каменные стены
  # ====================================================================
  masonry:
    name: "Эксперт по кладочным работам"
    short_name: "каменщик"
    boq_sections: [7]
    boq_section_names: ["Каменная кладка надземной части (включая перемычки)"]
    domain_description: |
      Каменная кладка из штучных материалов:
      - Газобетонные блоки, ячеистые блоки
      - Силикатные блоки
      - Кирпич (полнотелый, пустотелый)
      - Перемычки сборные / монолитные перемычки кладки
    candidate_revit_categories:
      - OST_Walls
    family_signal_words:
      include: [Блок, блок, Кирпич, кирпич, ячеист, газобет, силикат]
      exclude: [Бетон 200, Бетон 300, монолит, перекрыт]

  # ====================================================================
  # КРОВЛЯ — корпуса и стилобат
  # ====================================================================
  roofing:
    name: "Эксперт по кровлям"
    short_name: "кровельщик"
    boq_sections: [8, 9]
    boq_section_names: ["Кровли корпусов", "Кровля стилобатной части"]
    domain_description: |
      Кровельные работы: основание, гидроизоляция, утепление, покрытие.
      Виды: плоская инверсионная, классическая, скатная, эксплуатируемая.
    candidate_revit_categories:
      - OST_Roofs
      - OST_Floors  # плоская кровля иногда моделируется как Floor
    family_signal_words:
      include: [кровл, Кровл, парапет, гидроизоляц]

  # ====================================================================
  # ФАСАДЫ
  # ====================================================================
  facades:
    name: "Эксперт по фасадам"
    short_name: "фасадщик"
    boq_sections: [10]
    boq_section_names: ["Фасады (включая светопрозрачные конструкции, фасадные двери, парапеты, ограждения)"]
    domain_description: |
      Фасадные системы:
      - Утепление наружных стен (минвата, ПСБ-С, изоляция)
      - Финишная отделка наружных стен (штукатурка, плитка, керамогранит, навесные панели)
      - Светопрозрачные конструкции (витражи, окна на фасаде)
      - Парапеты, козырьки, входные группы (внешний слой)
    candidate_revit_categories:
      - OST_Walls          # слои: утеплитель + штукатурка/отделка наружных стен
      - OST_CurtainWallPanels
      - OST_CurtainWallMullions
      - OST_Windows
    family_signal_words:
      include: [Изоляция, утепл, Отделка, фасад, штукатурка_фасад]
      # ВАЖНО: должно работать с слоями стен, не только с отдельными элементами

  # ====================================================================
  # ОТДЕЛКА МОП (места общего пользования)
  # ====================================================================
  finishing_mop:
    name: "Эксперт по отделке мест общего пользования"
    short_name: "отделочник МОП"
    boq_sections: [11]
    boq_section_names: ["Отделка мест общего пользования"]
    domain_description: |
      Отделочные работы в МОП (холлы, коридоры, лифтовые холлы, лестницы):
      - Стяжки полов, плитка/керамогранит/линолеум полов
      - Штукатурка/шпаклёвка/окраска стен
      - Подвесные потолки, шпаклёвка-окраска потолков
      - Перегородки внутренние МОП (внутри уже отделочные слои)
    candidate_revit_categories:
      - OST_Walls           # с зоной МОП (по имени семейства)
      - OST_Floors          # стяжки и плитка
      - OST_Ceilings
    family_signal_words:
      include: [МОП, Штукатурка, Плитка, Стяжка, Отделка, Окраск, штукатурка_кровля]
      zone_filter: МОП

  # ====================================================================
  # ОТДЕЛКА ПАРКИНГА И ТЕХ.ПОМЕЩЕНИЙ
  # ====================================================================
  finishing_parking:
    name: "Эксперт по отделке паркинга и тех. помещений"
    short_name: "отделочник паркинг"
    boq_sections: [12]
    boq_section_names: ["Отделка паркинга и технических помещений"]
    domain_description: |
      Отделка подземных уровней (паркинг, тех. помещения, ИТП):
      - Покрытие пола паркинга (топпинг, эпоксидное)
      - Окраска стен (с гидроизоляцией)
      - Разметка
    candidate_revit_categories:
      - OST_Walls           # подвал, тех. помещения
      - OST_Floors          # пол паркинга
    family_signal_words:
      zone_filter: [подвал, паркинг, технич, тех_]

  # ====================================================================
  # ОТДЕЛКА КВАРТИР
  # ====================================================================
  finishing_apartments:
    name: "Эксперт по отделке квартир"
    short_name: "отделочник квартир"
    boq_sections: [13]
    boq_section_names: ["Отделка квартир"]
    domain_description: |
      Отделка квартир — варианты от white-box до полной чистовой:
      - Стяжки, гидроизоляция в санузлах
      - Штукатурка/шпаклёвка стен (без финиша или с финишом)
      - Подвесные потолки или ровные перекрытия
    candidate_revit_categories:
      - OST_Walls           # без МОП — только квартирные перегородки
      - OST_Floors          # квартирные полы
      - OST_Rooms           # для подсчёта площади квартир
    family_signal_words:
      zone_filter: квартиры

  # ====================================================================
  # ДВЕРИ
  # ====================================================================
  doors:
    name: "Эксперт по дверям"
    short_name: "двери"
    boq_sections: [14]
    boq_section_names: ["Двери"]
    domain_description: |
      Все типы дверей:
      - Входные металлические
      - Межквартирные
      - Межкомнатные
      - Технические, противопожарные (EI 30/60/90)
    candidate_revit_categories:
      - OST_Doors

  # ====================================================================
  # ЛЕСТНИЦЫ И МЕТАЛЛОКОНСТРУКЦИИ
  # ====================================================================
  metal_stairs:
    name: "Эксперт по металлическим лестницам и металлоконструкциям"
    short_name: "металлик"
    boq_sections: [15]
    boq_section_names: ["Устройство металлических лестниц, ограждений, козырьков, навесов"]
    domain_description: |
      Металлические конструкции:
      - Лестницы (не монолитные)
      - Ограждения, перила
      - Козырьки, навесы
      - Зонты над шахтами
    candidate_revit_categories:
      - OST_Stairs              # фильтр: не монолитные
      - OST_StairsRailing
      - OST_GenericModel        # часто козырьки и металлоконструкции

  # ====================================================================
  # ЛИФТЫ
  # ====================================================================
  elevators:
    name: "Эксперт по лифтовому оборудованию"
    short_name: "лифтовик"
    boq_sections: [24]
    boq_section_names: ["Монтаж лифтов и подъёмного оборудования"]
    domain_description: |
      Лифтовое оборудование (как комплект):
      - Пассажирские лифты
      - Грузовые
      - Эскалаторы / траволаторы (если есть)
    candidate_revit_categories:
      - OST_GenericModel        # лифты часто моделируются обобщёнными моделями

  # ====================================================================
  # ОКНА — A7: окна слиты в facades specialist. Этот блок оставлен как
  # historical reference; реальная classification окон — в facades выше.
  # ====================================================================
  # windows: REMOVED — A7 merged into facades

# ====================================================================
# Разделы, не покрываемые BIM-моделью (организационные, инженерка, ИТД)
