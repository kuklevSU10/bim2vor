  - {section: 4, name: "Эксплуатация водопонижения"}
  - {section: 16, name: "Конструкции под оборудование"}
  - {section: 17, name: "Водоснабжение"}
  - {section: 18, name: "Водоотведение"}
  - {section: 19, name: "Отопление"}
  - {section: 20, name: "Вентиляция и кондиционирование"}
  - {section: 21, name: "Электрооборудование"}
  - {section: 22, name: "Слаботочные системы"}
  - {section: 23, name: "Автоматизация"}
  - {section: 25, name: "Благоустройство"}
  - {section: 26, name: "Технология паркинга"}
  - {section: 27, name: "Технология мусороудаления"}
  - {section: 28, name: "Технология входных групп"}
  - {section: 29, name: "Навигация"}
  - {section: 30, name: "Наружные сети"}
