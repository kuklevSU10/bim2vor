# Реестр экспертов для Событие 6.1 (SOB_ATR / SOB_GLP / SOB_STR).
# Нумерация разделов ВОР этого проекта отличается от ВГК№5.
# Подспециалисты сохранены: facades/doors/windows делят раздел 06,
# finishing_mop/parking/apartments делят раздел 09.

specialists:
  # ====================================================================
  # МОНОЛИТ — разделы 04 (нулевой цикл) + 05 (надземный)
  # ====================================================================
  monolith:
    name: "Эксперт по монолитным конструкциям"
    short_name: "монолитчик"
    boq_sections: [4, 5]
    boq_section_names:
      - "Устройство конструкций нулевого цикла"
      - "Устройство монолитных ж/б конструкций надземной части"
    boq_subsections:
      - "04.01"  # свайное поле и фундаменты
      - "04.02"  # подготовка под фундаменты
      - "04.03"  # монолитные конструкции подземной части
      - "04.04"  # гидроизоляция
      - "05.01"  # плиты перекрытий
      - "05.02"  # плиты покрытия
      - "05.03"  # стены надземной части
      - "05.04"  # колонны и пилоны
      - "05.05"  # лестничные марши
      - "05.06"  # фундаменты под оборудование
      - "05.07"  # рампы
      - "05.08"  # крыльца, пандусы, козырьки
      - "05.09"  # деформационные швы
      - "05.10"  # термовкладыши
    domain_description: |
      Монолитные конструкции из тяжёлого/лёгкого бетона с арматурой:
      - Стены подвала, надземные стены (несущие монолитные)
      - Колонны, пилоны несущие
      - Перекрытия (плиты), покрытия
      - Фундаментные плиты, свайные ростверки
      - Лестничные марши и площадки (монолитные)
      - Балки, ригели, ростверки
      - Рампы автостоянки
      Сопутствующие работы: опалубка, арматура, гидроизоляция бетона.
    candidate_revit_categories:
      - OST_Walls
      - OST_Floors
      - OST_StructuralColumns
      - OST_StructuralFraming
      - OST_StructuralFoundation
      - OST_Stairs
    preferred_disciplines: [KR, AR]
    family_signal_words:
      include: [Бетон, бетон, монолит, фундамент, плита, ростверк, ригель, пилон, колонна]
      exclude: [Блок, кирпич, штукатурка, отделка, утеплит, изоляц, плитка, газобет]

  # ====================================================================
  # КЛАДКА — раздел 08 (стены и перегородки)
  # ====================================================================
  masonry:
    name: "Эксперт по кладочным работам"
    short_name: "каменщик"
    boq_sections: [8]
    boq_section_names: ["Устройство внутренних стен и перегородок"]
    boq_subsections:
      - "08.01"  # внутренние стены кроме внутриквартирных
      - "08.02"  # внутриквартирные стены и перегородки
    domain_description: |
      Каменная кладка из штучных материалов и каркасные перегородки:
      - Газобетонные блоки, ячеистые блоки
      - Силикатные блоки
      - Кирпич (полнотелый, пустотелый)
      - Перемычки сборные / монолитные перемычки кладки
      - ГКЛ-перегородки (если в модели)
    candidate_revit_categories:
      - OST_Walls
    preferred_disciplines: [AR]
    family_signal_words:
      include: [Блок, блок, Кирпич, кирпич, ячеист, газобет, силикат, перегородк, ГКЛ, гипс]
      exclude: [Бетон 200, Бетон 300, монолит, перекрыт]

  # ====================================================================
  # КРОВЛЯ — раздел 07
  # ====================================================================
  roofing:
    name: "Эксперт по кровлям"
    short_name: "кровельщик"
    boq_sections: [7]
    boq_section_names: ["Устройство кровли, включая устройство парапетов, установку водосточных воронок"]
    boq_subsections:
      - "07.01"  # эксплуатируемая кровля
      - "07.02"  # неэксплуатируемая кровля
      - "07.03"  # ограждение кровли, лестницы
      - "07.04"  # крышки парапетов/отливы
      - "07.05"  # крышки инженерных шахт
      - "07.06"  # водосточные воронки
    domain_description: |
      Кровельные работы: основание, гидроизоляция, утепление, покрытие.
      Виды: плоская инверсионная, классическая, эксплуатируемая.
      Включает парапеты, водосток, ограждения кровли.
    candidate_revit_categories:
      - OST_Roofs
      - OST_Floors
    preferred_disciplines: [AR]
    family_signal_words:
      include: [кровл, Кровл, парапет, гидроизоляц, водосток]

  # ====================================================================
  # ФАСАДЫ — подраздел 06.01, 06.02
  # ====================================================================
  facades:
    name: "Эксперт по фасадам"
    short_name: "фасадщик"
    boq_sections: [6]
    boq_section_names: ["Устройство наружных ограждающих конструкций — фасады"]
    boq_subsections:
      - "06.01"  # наружные стены (включая на кровле)
      - "06.02"  # фасады (лес, люлеки, платформы)
    domain_description: |
      Фасадные системы:
      - Утепление наружных стен (минвата, ПСБ-С)
      - Финишная отделка наружных стен (штукатурка, плитка, керамогранит, навесные панели)
      - Парапеты, козырьки, входные группы (внешний слой)
      - Устройство лесов и платформ для фасадных работ
    candidate_revit_categories:
      - OST_Walls
      - OST_CurtainWallPanels
      - OST_CurtainWallMullions
    preferred_disciplines: [AR]
    family_signal_words:
      include: [Изоляция, утепл, Отделка, фасад, штукатурка_фасад, наружн]
      exclude: [витраж, окно, дверь]

  # ====================================================================
  # ОКНА И ВИТРАЖИ — подраздел 06.03
  # ====================================================================
  windows:
    name: "Эксперт по оконным и витражным конструкциям"
    short_name: "оконщик"
    boq_sections: [6]
    boq_section_names: ["Устройство наружных ограждающих конструкций — светопрозрачные"]
    boq_subsections:
      - "06.03"  # светопрозрачные конструкции (все витражные подразделы 242-305)
    domain_description: |
      Оконные блоки и витражи:
      - ПВХ-окна
      - Алюминиевые витражи (тёплые, холодные)
      - Балконные двери/блоки
      - Витражи нежилых этажей
      - Витражи жилых этажей (включая межэтажные пояса)
      - Витражи криволинейные
      - Непрозрачные участки витражей
      - Окна лифтовых холлов
      - Витражи АИТ (легкосбрасываемые)
    candidate_revit_categories:
      - OST_Windows
      - OST_CurtainWallPanels
      - OST_CurtainWallMullions
    preferred_disciplines: [AR]
    family_signal_words:
      include: [витраж, Витраж, окно, Окно, балконн, стеклопакет, светопрозрачн, ПВХ, алюминиев]

  # ====================================================================
  # ДВЕРИ И ВОРОТА — подразделы 06.04, 06.05
  # ====================================================================
  doors:
    name: "Эксперт по дверям и воротам"
    short_name: "двери"
    boq_sections: [6]
    boq_section_names: ["Устройство наружных ограждающих конструкций — двери и ворота"]
    boq_subsections:
      - "06.04"  # наружные двери
      - "06.05"  # въездные ворота
    domain_description: |
      Наружные двери и ворота:
      - Входные металлические двери
      - Технические, противопожарные (EI 30/60/90)
      - Ворота въездные (высокоскоростные, секционные)
    candidate_revit_categories:
      - OST_Doors
    preferred_disciplines: [AR]
    family_signal_words:
      include: [дверь, Дверь, ворота, Ворота, EI, противопожарн]

  # ====================================================================
  # ОТДЕЛКА МОП — подраздел 09.01
  # ====================================================================
  finishing_mop:
    name: "Эксперт по отделке мест общего пользования"
    short_name: "отделочник МОП"
    boq_sections: [9]
    boq_section_names: ["Внутренние отделочные работы — МОП"]
    boq_subsections:
      - "09.01"  # МОП по дизайн-проекту
    domain_description: |
      Отделочные работы в МОП (холлы, коридоры, лифтовые холлы, лестницы):
      - Стяжки полов, плитка/керамогранит/линолеум полов
      - Штукатурка/шпаклёвка/окраска стен
      - Подвесные потолки, шпаклёвка-окраска потолков
      - Перегородки внутренние МОП
      - Включает детские клубы, репетиторские и помещения на кровле
    candidate_revit_categories:
      - OST_Walls
      - OST_Floors
      - OST_Ceilings
    preferred_disciplines: [AR]
    family_signal_words:
      include: [МОП, Штукатурка, Плитка, Стяжка, Отделка, Окраск]
      zone_filter: МОП

  # ====================================================================
  # ОТДЕЛКА НЕ ПО ДИЗАЙН-ПРОЕКТУ (паркинг, тех.помещения) — подраздел 09.02
  # ====================================================================
  finishing_parking:
    name: "Эксперт по отделке паркинга и тех. помещений"
    short_name: "отделочник паркинг"
    boq_sections: [9]
    boq_section_names: ["Внутренние отделочные работы — не по дизайн-проекту"]
    boq_subsections:
      - "09.02"  # не по дизайн-проекту (паркинг, тех)
      - "09.03"  # внутренние ворота
    domain_description: |
      Отделка подземных уровней и тех. помещений:
      - Покрытие пола паркинга (топпинг, эпоксидное)
      - Окраска стен (с гидроизоляцией)
      - Разметка
      - Внутренние ворота (противопожарные шторы)
    candidate_revit_categories:
      - OST_Walls
      - OST_Floors
    preferred_disciplines: [AR]
    family_signal_words:
      zone_filter: [подвал, паркинг, технич, тех_]

  # ====================================================================
  # ОТДЕЛКА КВАРТИР — подраздел 09.04
  # ====================================================================
  finishing_apartments:
    name: "Эксперт по отделке квартир"
    short_name: "отделочник квартир"
    boq_sections: [9]
    boq_section_names: ["Внутренние отделочные работы — квартиры"]
    boq_subsections:
      - "09.04"  # отделка квартир
    domain_description: |
      Отделка квартир — варианты от white-box до полной чистовой:
      - Стяжки, гидроизоляция в санузлах
      - Штукатурка/шпаклёвка стен (без финиша или с финишом)
      - Подвесные потолки или ровные перекрытия
    candidate_revit_categories:
      - OST_Walls
      - OST_Floors
      - OST_Rooms
    preferred_disciplines: [AR]
    family_signal_words:
      zone_filter: квартиры

  # ====================================================================
  # МЕТАЛЛОКОНСТРУКЦИИ — раздел 10
  # ====================================================================
  metal_stairs:
    name: "Эксперт по металлоконструкциям"
    short_name: "металлик"
    boq_sections: [10]
    boq_section_names: ["Устройство металлоконструкций, включая устройство ограждений"]
    boq_subsections:
      - "10.01"  # ограждение МХМТС и кладовых
      - "10.02"  # прочие металлоконструкции
      - "10.03"  # стремянки на кровле
    domain_description: |
      Металлические конструкции:
      - Ограждения МХМТС (мест хранения мусора) и кладовых
      - Прочие металлоконструкции (каркасы, обрамления)
      - Стремянки на кровле
      - Металлические ограждения
    candidate_revit_categories:
      - OST_Stairs
      - OST_StairsRailing
      - OST_GenericModel
    preferred_disciplines: [AR, KR]
    family_signal_words:
      include: [металл, Металл, ограждени, перил, стремянк, лестниц]
      exclude: [монолитн, бетон]

  # ====================================================================
  # ЛИФТЫ — раздел 13
  # ====================================================================
  elevators:
    name: "Эксперт по вертикальному транспорту"
    short_name: "лифтовик"
    boq_sections: [13]
    boq_section_names: ["Монтаж вертикального транспорта"]
    boq_subsections:
      - "13.01"  # лифты грузопассажирские
      - "13.02"  # подъемники
      - "13.03"  # отделка полов лифтовых кабин
    domain_description: |
      Лифтовое и подъёмное оборудование:
      - Пассажирские / грузопассажирские лифты
      - Подъёмники
      - Отделка кабин
    candidate_revit_categories:
      - OST_GenericModel
    preferred_disciplines: [AR]
    family_signal_words:
      include: [лифт, Лифт, подъемник, Подъемник, эскалатор]

# ====================================================================
# Разделы, не покрываемые BIM-моделью
# ====================================================================
out_of_bim_scope_sections:
  - {section: 1, name: "Подготовительный период"}
  - {section: 2, name: "Устройство котлована"}
  - {section: 3, name: "Обратная засыпка котлована"}
  - {section: 11, name: "Мероприятия по обеспечению доступа инвалидов"}
  - {section: 12, name: "Устройство внутренних инженерных систем"}
  - {section: 14, name: "Устройство системы мусороудаления"}
  - {section: 15, name: "Монтаж технологического оборудования"}
  - {section: 16, name: "Благоустройство"}
