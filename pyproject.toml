[project]
name = "bim2vor"
version = "0.1.0"
description = "BIM (Revit Excel) → ВОР (Bill of Quantities) automation system"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "polars>=0.20",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "anthropic>=0.40",
    "rich>=13.0",
    "click>=8.0",
    "xlsxwriter>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[tool.ruff]
line-length = 110
target-version = "py311"
